[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hakim-livekit"
version = "0.1.0"
description = "Hakim STT/TTS plugins for LiveKit Agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "livekit-agents>=1.0",
    "websockets>=12.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/tryHakimAI/hakim-livekit"

[tool.setuptools]
packages = ["hakim_livekit"]
